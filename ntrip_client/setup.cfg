
[develop]
script_dir=$base/lib/ntrip_client
[install]
install_scripts=$base/lib/ntrip_client

[flake8]
# Functional linting (pyflakes F, pycodestyle E/W) is enforced; the
# docstring (D), import-order (I), and quote-style (Q) families are
# grandfathered for the existing code, and W503 conflicts with W504.
max-line-length = 100
extend-ignore = D,I,Q,W503
exclude = build,install,log
