name: CI

on:
  push:
    branches: [main, ros2_develop]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    name: ROS2 ${{ matrix.distro }}
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: jazzy
            experimental: false
          - distro: kilted
            experimental: false
          # Rolling tracks the next release; failures are advisory.
          - distro: rolling
            experimental: true
    container:
      image: ros:${{ matrix.distro }}
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          apt-get update
          rosdep update --rosdistro ${{ matrix.distro }}
          # The lint test dependencies intermittently drop out of the
          # rolling rosdep index for older Ubuntu bases; resolve them
          # via apt directly and let rosdep handle the rest.
          rosdep install --from-paths . --ignore-src -y \
            --rosdistro ${{ matrix.distro }} \
            --skip-keys "ament_lint_common ament_lint_auto ament_pep257 ament_copyright ament_flake8"
          apt-get install -y \
            ros-${{ matrix.distro }}-ament-lint-common \
            ros-${{ matrix.distro }}-ament-lint-auto \
            ros-${{ matrix.distro }}-ament-pep257 \
            ros-${{ matrix.distro }}-ament-copyright \
            ros-${{ matrix.distro }}-ament-flake8

      - name: Build
        shell: bash
        run: |
          source /opt/ros/${{ matrix.distro }}/setup.bash
          colcon build --event-handlers console_cohesion+ \
            --cmake-args -DCMAKE_BUILD_TYPE=Release

      - name: Test
        shell: bash
        run: |
          source /opt/ros/${{ matrix.distro }}/setup.bash
          source install/setup.bash
          colcon test --event-handlers console_cohesion+
          colcon test-result --verbose

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-results-${{ matrix.distro }}
          path: build/*/test_results/**/*.xml
          if-no-files-found: ignore
